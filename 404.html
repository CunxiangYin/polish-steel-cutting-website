<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Punaise Mechanical Equipment</title>
    <meta name="description" content="The page you are looking for could not be found. Return to Punaise Mechanical Equipment homepage.">
    <link rel="stylesheet" href="/style.min.css">
    <style>
        .error-404 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        
        .error-content {
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .error-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .error-btn.secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="error-404">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Sorry, the page you are looking for doesn't exist or has been moved.
            </p>
            <div class="error-buttons">
                <a href="/" class="error-btn">Go to Homepage</a>
                <a href="/#contact" class="error-btn secondary">Contact Us</a>
            </div>
        </div>
    </div>
    
    <script>
        // 404页面跟踪
        if (typeof window.gtag !== 'undefined') {
            gtag('event', '404_error', {
                'page_location': window.location.href,
                'page_referrer': document.referrer
            });
        }
        
        // 5秒后自动跳转到首页
        setTimeout(function() {
            // window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
