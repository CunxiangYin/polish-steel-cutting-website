<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- Punaise Mechanical Equipment Logo - Main Version -->
  
  <defs>
    <!-- Primary gradient - Industrial blue -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary gradient - Tech cyan -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metal gradient -->
    <radialGradient id="metalGrad">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b0b0b0;stop-opacity:1" />
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Logo Symbol - Abstract cutting blade with gear -->
  <g id="logo-symbol" transform="translate(40, 40)">
    
    <!-- Background circle -->
    <circle cx="0" cy="0" r="32" fill="url(#metalGrad)" opacity="0.1"/>
    
    <!-- Gear wheel representation -->
    <g id="gear">
      <!-- Main gear body -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.8"/>
      
      <!-- Gear teeth (simplified) -->
      <g id="teeth">
        <rect x="-3" y="-30" width="6" height="8" fill="url(#primaryGrad)" rx="1"/>
        <rect x="-3" y="22" width="6" height="8" fill="url(#primaryGrad)" rx="1"/>
        <rect x="-30" y="-3" width="8" height="6" fill="url(#primaryGrad)" rx="1"/>
        <rect x="22" y="-3" width="8" height="6" fill="url(#primaryGrad)" rx="1"/>
        
        <!-- Diagonal teeth -->
        <g transform="rotate(45)">
          <rect x="-3" y="-30" width="6" height="8" fill="url(#primaryGrad)" rx="1"/>
          <rect x="-3" y="22" width="6" height="8" fill="url(#primaryGrad)" rx="1"/>
          <rect x="-30" y="-3" width="8" height="6" fill="url(#primaryGrad)" rx="1"/>
          <rect x="22" y="-3" width="8" height="6" fill="url(#primaryGrad)" rx="1"/>
        </g>
      </g>
    </g>
    
    <!-- Central cutting blade design -->
    <g id="blade" transform="rotate(-45)">
      <!-- Main blade -->
      <path d="M 0,-20 L 8,-8 L 8,8 L 0,20 L -8,8 L -8,-8 Z" 
            fill="url(#techGrad)" 
            opacity="0.9"/>
      
      <!-- Blade highlight -->
      <rect x="-1" y="-20" width="2" height="40" fill="#ffffff" opacity="0.7"/>
      
      <!-- Cutting edge -->
      <polygon points="0,-22 10,-10 10,-8 0,-18 -10,-8 -10,-10" 
               fill="url(#primaryGrad)" 
               opacity="0.9"/>
    </g>
    
    <!-- Center hub -->
    <circle cx="0" cy="0" r="6" fill="url(#primaryGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Company Name -->
  <g id="text-group">
    <!-- Main text -->
    <text x="85" y="38" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0052cc">
      PUNAISE
    </text>
    
    <!-- Chinese name -->
    <text x="85" y="54" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#666666">
      普耐斯机电设备
    </text>
    
    <!-- Decorative line -->
    <rect x="85" y="58" width="100" height="2" fill="url(#techGrad)" opacity="0.8"/>
    
    <!-- Tagline -->
    <text x="85" y="72" font-family="Arial, sans-serif" font-size="8" letter-spacing="1" fill="#999999">
      STEEL PROCESSING SOLUTIONS
    </text>
  </g>
  
  <!-- Tech pattern overlay (subtle) -->
  <g opacity="0.05">
    <line x1="0" y1="40" x2="240" y2="40" stroke="#0052cc" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#0052cc" stroke-width="0.5"/>
  </g>
</svg>