Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self' https://embed.tawk.to https://va.tawk.to wss://va.tawk.to https://*.tawk.to wss://*.tawk.to; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://embed.tawk.to https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://embed.tawk.to; img-src 'self' data: https: https://embed.tawk.to https://va.tawk.to https://*.tawk.to https://www.google-analytics.com; font-src 'self' data: https://embed.tawk.to; connect-src 'self' https://embed.tawk.to https://va.tawk.to wss://va.tawk.to https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com; frame-src https://embed.tawk.to https://va.tawk.to https://*.tawk.to; media-src https://embed.tawk.to https://va.tawk.to https://*.tawk.to;"

[[headers]]
