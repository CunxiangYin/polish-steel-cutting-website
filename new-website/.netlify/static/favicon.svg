<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Punaise Favicon - Simplified Icon -->
  
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#f8f9fa"/>
  
  <!-- Simplified gear with blade -->
  <g transform="translate(16, 16)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#iconGrad)" stroke-width="2"/>
    
    <!-- Gear teeth (4 main) -->
    <g>
      <rect x="-2" y="-14" width="4" height="4" fill="url(#iconGrad)"/>
      <rect x="-2" y="10" width="4" height="4" fill="url(#iconGrad)"/>
      <rect x="-14" y="-2" width="4" height="4" fill="url(#iconGrad)"/>
      <rect x="10" y="-2" width="4" height="4" fill="url(#iconGrad)"/>
    </g>
    
    <!-- Central blade (simplified) -->
    <g transform="rotate(45)">
      <rect x="-1.5" y="-10" width="3" height="20" fill="url(#bladeGrad)"/>
      <polygon points="0,-11 4,-7 0,-3 -4,-7" fill="url(#iconGrad)"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="url(#iconGrad)"/>
  </g>
</svg>