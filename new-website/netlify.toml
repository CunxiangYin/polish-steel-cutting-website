[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions 配置
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API 路由重定向到 Netlify Functions
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

# 多语言重定向规则
[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302

# SPA 回退规则 - 支持 Next.js 动态路由
[[redirects]]
  from = "/zh/*"
  to = "/zh/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/th/*"
  to = "/th/index.html"
  status = 200

[[redirects]]
  from = "/vi/*"
  to = "/vi/index.html"
  status = 200

[[redirects]]
  from = "/ms/*"
  to = "/ms/index.html"
  status = 200

[[redirects]]
  from = "/id/*"
  to = "/id/index.html"
  status = 200

[[redirects]]
  from = "/es/*"
  to = "/es/index.html"
  status = 200

[[redirects]]
  from = "/pt/*"
  to = "/pt/index.html"
  status = 200

# 安全头设置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://embed.tawk.to https://va.tawk.to wss://va.tawk.to https://*.tawk.to wss://*.tawk.to; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://embed.tawk.to https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://embed.tawk.to; img-src 'self' data: https: https://embed.tawk.to https://va.tawk.to https://*.tawk.to https://www.google-analytics.com; font-src 'self' data: https://embed.tawk.to; connect-src 'self' https://embed.tawk.to https://va.tawk.to wss://va.tawk.to https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com; frame-src https://embed.tawk.to https://va.tawk.to https://*.tawk.to; media-src https://embed.tawk.to https://va.tawk.to https://*.tawk.to;"

# 缓存设置
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 语言版本的 hreflang 支持
[[headers]]
  for = "/zh/"
  [headers.values]
    Link = '''<https://punaise-equipment.netlify.app/zh/>; rel="alternate"; hreflang="zh", <https://punaise-equipment.netlify.app/en/>; rel="alternate"; hreflang="en", <https://punaise-equipment.netlify.app/th/>; rel="alternate"; hreflang="th", <https://punaise-equipment.netlify.app/vi/>; rel="alternate"; hreflang="vi", <https://punaise-equipment.netlify.app/ms/>; rel="alternate"; hreflang="ms", <https://punaise-equipment.netlify.app/id/>; rel="alternate"; hreflang="id", <https://punaise-equipment.netlify.app/es/>; rel="alternate"; hreflang="es", <https://punaise-equipment.netlify.app/pt/>; rel="alternate"; hreflang="pt", <https://punaise-equipment.netlify.app/zh/>; rel="alternate"; hreflang="x-default"'''